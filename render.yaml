# Render Blueprint - free-tier backend deployment.
# Render dashboard -> New -> Blueprint -> select this repository.
# Values marked `sync: false` are secrets you paste into the dashboard;
# they are never stored in Git.
services:
  - type: web
    name: assignment-portal-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true          # Render creates a random secret
      - key: DATABASE_URL
        sync: false                  # Supabase / Neon PostgreSQL connection string
      - key: STORAGE_PROVIDER
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false                  # e.g. https://<ref>.supabase.co/storage/v1/s3
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false                  # e.g. https://handin-portal.vercel.app
      - key: PUBLIC_API_URL
        sync: false                  # e.g. https://assignment-portal-api.onrender.com
      - key: MAX_UPLOAD_MB
        value: "10"
